<!DOCTYPE html>
<html>
<head>
    <title>Lego Store Login</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            border: 2px solid #333;
            padding: 50px;
            text-align: center;
            width: 400px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 { margin-top: 0; }
        
        input {
            padding: 10px;
            margin: 10px 0;
            width: 80%;
            border: 2px solid #333;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            padding: 8px 20px;
            cursor: pointer;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            margin-top: 10px;
        }
        button:hover { background: #555; }

        .create-account-btn {
            background: transparent;
            color: #333;
            border: 1px solid #333;
            margin-top: 15px;
        }
        .create-account-btn:hover { background: #eee; }

        .error-msg {
            color: red;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the<br>Lego Store</h1>
        
        {% if error %}
        <p class="error-msg">{{ error }}</p>
        {% endif %}
        
        <form action="/" method="POST">
            <input type="text" name="user_id" placeholder="User ID" required>
            <!-- NEW PASSWORD FIELD -->
            <input type="password" name="password" placeholder="Password" required>
            <br>
            <button type="submit">Login</button>
        </form>

        <!-- Link to Create Account Page -->
        <a href="/create_user">
            <button type="button" class="create-account-btn">Create New Account</button>
        </a>
    </div>
</body>
</html>
